[project]
name = "pyobs-asi"
version = "2.0.0.dev4"
description = "pyobs model for ASI cameras"
authors = [{ name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" }]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.2.5,<3",
    "pyobs-core>=2.0.0.dev48,<3",
    "zwoasi>=0.2.0",
]

[project.optional-dependencies]
gui = [
    "pyobs-core[gui]>=2.0.0.dev48,<3",
    "qasync>=0.28.0",
]

[project.scripts]
asi-gui = 'pyobs_asi.gui:main'

[dependency-groups]
dev = [
    "black>=25.1.0,<27",
    "ruff>=0.9.0",
    "pyrefly>=1.1.1",
    "pre-commit>=4.2.0,<5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G"]

[tool.pyrefly]
python-version = "3.11"
project-excludes = ["pyobs_asi/gui.py"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
